
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thomas Tire Commercial CRM</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #171717;
    }
    header {
      background: #111;
      color: white;
      padding: 24px;
      text-align: center;
      border-bottom: 6px solid #d71920;
    }
    header h1 { margin: 0; }
    header p { color: #ff4444; }
    main {
      max-width: 700px;
      margin: 50px auto;
      padding: 24px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
    }
    .card h2 { margin-top: 0; }
  </style>
</head>
<body>
  <header>
    <h1>THOMAS TIRE</h1>
    <p>COMMERCIAL CRM</p>
  </header>

  <main>
    <h2>Sales Dashboard</h2>
    <div class="card">
      <h2>Daily Sales Activity</h2>
      <p>Record customer visits and phone calls.</p>
    </div>
    <div class="card">
      <h2>Customers & Prospects</h2>
      <p>Manage your assigned commercial accounts.</p>
    </div>
    <div class="card">
      <h2>Follow-Ups</h2>
      <p>Keep track of upcoming customer opportunities.</p>
    </div>
    <div class="card">
      <h2>Management Reports</h2>
      <p>Review sales activity and team performance.</p>
    </div>
  </main>
</body>
</html>
